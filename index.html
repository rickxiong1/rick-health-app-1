
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZenWork Health Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        background: #ffffff;
        color: #1a1a1a;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Mesh Gradient Background inspired by user reference */
      .aura-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: #ffffff;
        background-image: 
          radial-gradient(at 0% 0%, rgba(122, 235, 255, 0.4) 0px, transparent 50%),
          radial-gradient(at 50% 0%, rgba(255, 255, 255, 1) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(0, 242, 255, 0.2) 0px, transparent 50%),
          radial-gradient(at 10% 90%, rgba(212, 0, 255, 0.25) 0px, transparent 50%),
          radial-gradient(at 90% 90%, rgba(79, 70, 229, 0.2) 0px, transparent 50%),
          radial-gradient(at 50% 50%, rgba(255, 255, 255, 0.5) 0px, transparent 50%);
        filter: blur(20px);
        transform: scale(1.1); /* Prevent blurred edges */
      }

      /* Enhanced Glassmorphism & Depth */
      .glass-container {
        position: relative;
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 
          0 4px 24px -1px rgba(0, 0, 0, 0.04),
          0 12px 48px -10px rgba(0, 0, 0, 0.08),
          inset 0 1px 1px rgba(255, 255, 255, 0.8);
      }

      /* Light Sheen / Gloss Effect */
      .glass-sheen::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 60%);
        pointer-events: none;
        z-index: 1;
      }

      .tap-pill {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 
          0 20px 40px -12px rgba(0, 0, 0, 0.08),
          inset 0 1px 1px rgba(255, 255, 255, 1);
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }

      /* Animation Utilities */
      .animate-in {
        animation-duration: 0.5s;
        animation-fill-mode: both;
      }
      .slide-in-from-bottom-4 {
        animation-name: slideInFromBottom;
      }
      @keyframes slideInFromBottom {
        from { transform: translateY(1rem); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .app-container {
        animation: fadeIn 1.2s cubic-bezier(0.2, 0, 0.2, 1);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .clock-hand {
        transform-origin: bottom center;
        transition: transform 0.5s cubic-bezier(0.4, 2.08, 0.55, 0.44);
      }
      
      /* Metric Update Highlight Animation */
      @keyframes updateHighlight {
        0% { transform: scale(1); filter: brightness(1); }
        30% { transform: scale(1.03); filter: brightness(1.1); }
        100% { transform: scale(1); filter: brightness(1); }
      }
      .animate-update {
        animation: updateHighlight 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
        "recharts": "https://esm.sh/recharts@^3.7.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3"
      }
    }
    </script>
  </head>
  <body>
    <div class="aura-bg"></div>
    <div id="root"></div>
  </body>
</html>
